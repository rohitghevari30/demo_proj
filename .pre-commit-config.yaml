# Level 1 — Code Level (Pre-Commit Security)
# Run `pre-commit install` after `pip install pre-commit` to activate.
repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-r", "app"]

  - repo: https://github.com/returntocorp/semgrep
    rev: v1.78.0
    hooks:
      - id: semgrep
        args: ["--config=auto", "--error"]
