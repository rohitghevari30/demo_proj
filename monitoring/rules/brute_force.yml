# Level 8 — Prometheus alert rule for brute force detection
groups:
  - name: brute_force_alerts
    rules:
      - alert: BruteForceLoginAttempt
        expr: increase(failed_logins_total[3m]) > 200
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Possible brute-force attack detected"
          description: "More than 200 failed logins from a single source in 3m."
