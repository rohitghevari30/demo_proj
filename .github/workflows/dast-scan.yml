name: Level 6 - DAST Scan (Staging Only)

on:
  workflow_dispatch:   # run manually for now — wire to staging deploy later
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Full Scan
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: "http://98.89.4.135:5000"
          allow_issue_writing: false
          cmd_options: "-a"
          # NOTE: never point this at your Cloudflare-fronted prod domain
          # Full scan actively attacks the app (SQLi, XSS payloads, etc.)
          # unlike the baseline scan which only does passive checks.

      # TODO: parse ZAP report and push results into the React dashboard