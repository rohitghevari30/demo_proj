name: Level 6 - DAST Scan (Staging Only)

on:
  workflow_dispatch:   # run manually for now — wire to staging deploy later
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://98.89.4.135:5000"
          allow_issue_writing: false
          # NOTE: never point this at your Cloudflare-fronted prod domain
          # Baseline scan = passive checks only (headers, cookies, disclosure).
          # SQLi/XSS on /login and /search were verified manually — see
          # level_6_findings.md for the curl-based proof-of-concept.

      # TODO: parse ZAP report and push results into the React dashboard