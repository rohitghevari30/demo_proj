name: Level 7 - Network Exposure Check

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * *"   # daily periodic check

jobs:
  network-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install shodan

      - name: Run Nmap scan
        run: |
          sudo apt-get update && sudo apt-get install -y nmap
          nmap -sV -Pn ${{ secrets.BACKEND_IP }}

      - name: Run Shodan check
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: python scripts/shodan_check.py